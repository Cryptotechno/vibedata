<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dashboard Grid -->
  <g transform="translate(40, 80)">
    <!-- Top Stats Row -->
    <g transform="translate(0, 0)">
      <!-- Stat Card 1 -->
      <rect x="0" y="0" width="160" height="100" rx="12" fill="white" stroke="#E2E8F0" stroke-width="1"/>
      <text x="16" y="30" fill="#64748B" font-size="14">Total Impressions</text>
      <text x="16" y="65" fill="#1E293B" font-size="24" font-weight="600">2.4M</text>
      <path d="M16 80 L60 80" stroke="#10B981" stroke-width="2"/>
      <text x="70" y="84" fill="#10B981" font-size="12">+12.5%</text>
      
      <!-- Stat Card 2 -->
      <rect x="180" y="0" width="160" height="100" rx="12" fill="white" stroke="#E2E8F0" stroke-width="1"/>
      <text x="196" y="30" fill="#64748B" font-size="14">Click-Through Rate</text>
      <text x="196" y="65" fill="#1E293B" font-size="24" font-weight="600">3.2%</text>
      <path d="M196 80 L240 80" stroke="#E91E63" stroke-width="2"/>
      <text x="250" y="84" fill="#E91E63" font-size="12">+8.3%</text>
      
      <!-- Stat Card 3 -->
      <rect x="360" y="0" width="160" height="100" rx="12" fill="white" stroke="#E2E8F0" stroke-width="1"/>
      <text x="376" y="30" fill="#64748B" font-size="14">Conversion Rate</text>
      <text x="376" y="65" fill="#1E293B" font-size="24" font-weight="600">4.8%</text>
      <path d="M376 80 L420 80" stroke="#F4511E" stroke-width="2"/>
      <text x="430" y="84" fill="#F4511E" font-size="12">+15.2%</text>
    </g>

    <!-- Main Chart -->
    <g transform="translate(0, 120)">
      <rect x="0" y="0" width="520" height="280" rx="12" fill="white" stroke="#E2E8F0" stroke-width="1"/>
      <text x="20" y="40" fill="#1E293B" font-size="16" font-weight="600">Campaign Performance</text>
      
      <!-- Chart Grid -->
      <g transform="translate(20, 60)" stroke="#E2E8F0" stroke-width="1">
        <line x1="0" y1="0" x2="480" y2="0" />
        <line x1="0" y1="40" x2="480" y2="40" />
        <line x1="0" y1="80" x2="480" y2="80" />
        <line x1="0" y1="120" x2="480" y2="120" />
        <line x1="0" y1="160" x2="480" y2="160" />
      </g>
      
      <!-- Chart Lines -->
      <g transform="translate(20, 60)">
        <!-- Impressions Line -->
        <path d="M0 120 C80 100, 160 140, 240 80 C320 20, 400 60, 480 40" 
              stroke="#E91E63" stroke-width="2" fill="none"/>
        <!-- CTR Line -->
        <path d="M0 140 C80 120, 160 160, 240 100 C320 40, 400 80, 480 60" 
              stroke="#F4511E" stroke-width="2" fill="none"/>
      </g>
    </g>

    <!-- Bottom Stats -->
    <g transform="translate(0, 420)">
      <!-- Performance Breakdown -->
      <rect x="0" y="0" width="250" height="160" rx="12" fill="white" stroke="#E2E8F0" stroke-width="1"/>
      <text x="20" y="30" fill="#1E293B" font-size="14" font-weight="600">Channel Performance</text>
      
      <!-- Donut Chart -->
      <circle cx="125" cy="100" r="50" fill="none" stroke="#E2E8F0" stroke-width="8"/>
      <path d="M125 50 A50 50 0 0 1 171 125" stroke="#E91E63" stroke-width="8"/>
      <path d="M171 125 A50 50 0 0 1 125 175" stroke="#F4511E" stroke-width="8"/>
      <path d="M125 175 A50 50 0 0 1 79 125" stroke="#10B981" stroke-width="8"/>
      
      <!-- Activity Feed -->
      <rect x="270" y="0" width="250" height="160" rx="12" fill="white" stroke="#E2E8F0" stroke-width="1"/>
      <text x="290" y="30" fill="#1E293B" font-size="14" font-weight="600">Recent Activity</text>
      
      <!-- Activity Items -->
      <g transform="translate(290, 50)">
        <circle cx="6" cy="6" r="4" fill="#E91E63"/>
        <text x="20" y="10" fill="#64748B" font-size="12">Campaign "Q4 Promotion" started</text>
        
        <circle cx="6" cy="36" r="4" fill="#F4511E"/>
        <text x="20" y="40" fill="#64748B" font-size="12">Budget increased for "Brand Awareness"</text>
        
        <circle cx="6" cy="66" r="4" fill="#10B981"/>
        <text x="20" y="70" fill="#64748B" font-size="12">New audience segment added</text>
      </g>
    </g>
  </g>
</svg> 